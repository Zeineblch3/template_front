version: '3'
services:
  signup-app:
    image: signup
    container_name: signup-app
    build: .
    ports:
      - "4000:4000"
    env_file:
      - ./.env
    volumes:
      - type: bind
        source: .
        target: /app
        read_only: true
      - /app/node_modules
      - /app/dist
    command: npm run start-dev
    environment:
      - NODE_ENV=development
